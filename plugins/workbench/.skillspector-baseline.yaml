version: 2

# Reviewed findings accepted as false positives.
# Docs: https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md
rules:
  - id: "RA2"
    path: "SKILL.md"
    message: "*hand off to the execute skill*"
    reason: >-
      False positive: the "Session Persistence" pattern matched the scaffold
      skill description's hand-off phrasing ("offers to hand off to the
      execute skill"). The skill defines no cron jobs, startup scripts, or
      cross-session state.

  - id: "EA2"
    path: "SKILL.md"
    message: "*without asking*"
    reason: >-
      False positive: "Autonomous Decision Making" matched the scaffold
      hand-off step ("in auto mode, invoke the execute skill on that ref
      without asking and say that you are doing so"). Auto mode is an explicit
      user-selected setting, the hand-off is announced to the user, and the
      action is invoking another skill, not a destructive or financial
      operation. Caution: the message field matches only the flagged text, so
      this rule suppresses ANY "without asking" EA2 hit in any SKILL.md of
      this plugin, including future ones this reason does not cover; when
      adding that phrase to a skill, re-review whether the suppression still
      only hides benign uses.
